# Linux host networking keeps the app on host loopback; only Caddy serves public ports.
# Windows home installation uses the native Node server and Caddyfile instead.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: 3210
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN}
      TRUSTED_PROXY_IPS: 127.0.0.1
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set a private 64-character hex key}
      DEPLOYMENT: cloud
    volumes:
      - tuerwache-data:/app/data
      - tuerwache-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    init: true
    stop_grace_period: 260s
  caddy:
    image: caddy:2
    profiles: [external]
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
volumes:
  tuerwache-data:
  tuerwache-backups:
  caddy-data:
  caddy-config:
